<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071713">
<title>FII Smart</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="shortcut icon" href="./favicon.ico">
<style>:root{--bg:#061411;--card:#0e261f;--line:#21473b;--text:#eef8f4;--muted:#8caaa0;--green:#48dfa2;--gold:#f2c86d;--red:#ff858d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#174a3a,transparent 34%),var(--bg);color:var(--text);font:14px system-ui}button,input,select,textarea{font:inherit}.app{max-width:1120px;margin:auto;padding:18px 14px 94px}.top,.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:url('./icon-192.png') center/cover}.muted{color:var(--muted)}h1,h2,h3,p{margin:0}.hero,.card{background:linear-gradient(145deg,#12372c,var(--card));border:1px solid var(--line);border-radius:20px;padding:18px}.hero{margin-top:17px}.ticker{font-size:38px;font-weight:850;margin:5px 0}.tag{display:inline-block;color:var(--green);background:#163b30;padding:6px 10px;border-radius:99px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 22px}.kpi b{display:block;font-size:20px;margin-top:6px}.btn{border:0;border-radius:12px;background:var(--green);color:#042018;font-weight:750;padding:10px 13px}.btn.alt{background:#173b31;color:var(--text);border:1px solid #2b5a4a}.btn.red{background:#3c2024;color:#ffb9bd}.status{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:#081c17}.table{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;min-width:820px;border-collapse:collapse;background:#0a1e19}th,td{padding:12px;text-align:left;border-bottom:1px solid #193a31}th{color:var(--muted)}.section{margin-top:22px}.page{display:none}.page.on{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#071813ee;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}nav button{background:none;border:0;color:var(--muted);padding:15px 17px}nav button.on{color:var(--green)}dialog{width:min(680px,94%);border:1px solid var(--line);border-radius:20px;background:#0d241e;color:var(--text);padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #2c5044;border-radius:11px;background:#071a15;color:var(--text)}.full{grid-column:1/-1}.fund{margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.score{font-size:22px;font-weight:850;color:var(--green)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.head,.fund{align-items:flex-start;flex-direction:column}nav button{padding:14px 8px;font-size:12px}}</style></head><body>
<main class="app"><header class="top"><div class="brand"><div class="logo"></div><div><h1>FII Smart</h1><span class="muted">Carteira e decisão de aportes</span></div></div><span class="muted" id="today"></span></header>
<section class="page on" id="home"><div class="hero"><span class="muted">APORTE RECOMENDADO</span><div class="ticker" id="recommendation">--</div><span class="tag" id="reason">Aguardando cálculo</span><div class="actions" style="justify-content:flex-start;margin-top:16px"><b id="contribution"></b><button class="btn" onclick="openMove()">Registrar aporte</button></div></div><div id="status" class="status">Configure o Worker em Ajustes.</div><div class="grid" id="kpis"></div><div class="head"><h2>Ranking da carteira</h2><div><button class="btn alt" onclick="updateAll()">↻ Atualizar todos</button> <button class="btn" onclick="openFund()">+ FII</button></div></div><div class="table section"><table><thead><tr><th>#</th><th>FII</th><th>Preço</th><th>DY</th><th>P/VP</th><th>Score</th><th>Ação</th></tr></thead><tbody id="ranking"></tbody></table></div></section>
<section class="page" id="discover"><h2>Descobrir FIIs</h2><div class="card section"><div class="form"><div class="field"><label>Preço máximo</label><input id="maxPrice" type="number" value="20"></div><div class="field"><label>DY mínimo (%)</label><input id="minDY" type="number" value="7"></div><div class="field"><label>P/VP máximo</label><input id="maxPVP" type="number" value="1.10"></div><div class="field"><label>Score mínimo</label><input id="minScore" type="number" value="55"></div></div><button id="discoverButton" class="btn section" onclick="discover()">🔎 Buscar 5 melhores</button></div><div id="discoverResults" class="section"></div></section>
<section class="page" id="portfolio"><div class="head"><h2>Carteira</h2><button class="btn" onclick="openFund()">+ FII</button></div><div id="funds" class="section"></div></section>
<section class="page" id="settings"><h2>Ajustes</h2><div class="card section"><div class="form"><div class="field"><label>Cloudflare Worker</label><input id="apiUrl"></div><div class="field"><label>Aporte mensal</label><input id="aporte" type="number"></div><div class="field full"><label>Universo de busca, separado por vírgula</label><textarea id="universe" rows="5"></textarea></div></div><button class="btn section" onclick="saveSettings()">Salvar</button></div></section></main>
<nav><button class="on" data-page="home">Início</button><button data-page="discover">Descobrir</button><button data-page="portfolio">Carteira</button><button data-page="settings">Ajustes</button></nav>
<dialog id="fundDialog"><h2>Adicionar/editar FII</h2><div class="form" id="fundForm"></div><div class="actions section"><button class="btn alt" onclick="fundDialog.close()">Cancelar</button><button class="btn" onclick="saveFund()">Salvar</button></div></dialog><dialog id="moveDialog"><h2>Registrar compra</h2><div class="form" id="moveForm"></div><div class="actions section"><button class="btn alt" onclick="moveDialog.close()">Cancelar</button><button class="btn" onclick="saveMove()">Salvar</button></div></dialog>
<script>
const defaultUniverse='ALZR11,BCRI11,BRCO11,BTLG11,CPTS11,GARE11,GGRC11,HGBS11,HGLG11,HSML11,IRDM11,JSRE11,KFOF11,KNCR11,KNIP11,KNRI11,KNSC11,LVBI11,MALL11,MXRF11,PMLL11,PVBI11,RBRF11,RBRR11,RECR11,RECT11,TRXF11,VISC11,XPLG11,XPML11';
let db=JSON.parse(localStorage.getItem('fiiSmart')||'null')||{settings:{apiUrl:'',contribution:250,universe:defaultUniverse},funds:[],moves:[]};db.settings={apiUrl:'',contribution:250,universe:defaultUniverse,...db.settings};const n=v=>Number(v||0),money=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),pct=v=>(n(v)*100).toFixed(1)+'%',clamp=v=>Math.max(0,Math.min(100,v));
function dyGrade(d){let p=n(d)*100;return p<5?20:p<7?50:p<9?75:p<=13?100:p<=16?85:p<=20?60:30}function pvpGrade(p){p=n(p);return p<=0?0:p<.6?35:p<.75?65:p<=.95?100:p<=1.05?90:p<=1.15?70:40}function fresh(date){if(!date)return 30;let days=(Date.now()-new Date(date+'T12:00').getTime())/86400000;return days<=35?100:days<=65?85:days<=95?65:days<=120?45:20}function score(f){let base=.46*dyGrade(f.dy)+.38*pvpGrade(f.pvp)+.16*fresh(f.updated),pen=0;if(n(f.dy)*100>20)pen+=15;if(n(f.pvp)<.6)pen+=10;return clamp(base-pen)}
function persist(){localStorage.setItem('fiiSmart',JSON.stringify(db));render()}function api(){let x=db.settings.apiUrl.replace(/\/+$/,'');if(!x)throw Error('Configure o Worker.');return x}async function request(t){let r=await fetch(`${api()}/fii?ticker=${t}`),d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Falha');return{ticker:d.ticker,price:d.price,dy:d.dividendYield12m,pvp:d.priceToNav,type:d.segmentType||'FII',updated:String(d.referenceDate||d.updatedAt).slice(0,10),source:d.source}}
function render(){today.textContent=new Date().toLocaleDateString('pt-BR');apiUrl.value=db.settings.apiUrl;aporte.value=db.settings.contribution;universe.value=db.settings.universe;db.funds.forEach(f=>f.score=score(f));let total=db.moves.reduce((s,m)=>s+m.qty*(db.funds.find(f=>f.ticker===m.ticker)?.price||m.price),0),reco=[...db.funds].sort((a,b)=>b.score-a.score)[0];recommendation.textContent=reco?.ticker||'--';reason.textContent=reco?'Maior score atual':'Cadastre seus FIIs';contribution.textContent=money(db.settings.contribution);kpis.innerHTML=[['Patrimônio',money(total)],['FIIs',db.funds.length],['Aporte',money(db.settings.contribution)],['Top score',reco?reco.score.toFixed(0):'-']].map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');ranking.innerHTML=[...db.funds].sort((a,b)=>b.score-a.score).map((f,i)=>`<tr><td>${i+1}</td><td><b>${f.ticker}</b></td><td>${money(f.price)}</td><td>${pct(f.dy)}</td><td>${n(f.pvp).toFixed(2)}x</td><td>${f.score.toFixed(0)}/100</td><td>${f.score>=75?'PRIORIZAR':f.score>=55?'ANALISAR':'MONITORAR'}</td></tr>`).join('');funds.innerHTML=db.funds.map(f=>`<div class="card fund"><div><h3>${f.ticker}</h3><span class="muted">${money(f.price)} · Score ${score(f).toFixed(0)}</span></div><div><button class="btn alt" onclick="openFund('${f.ticker}')">Editar</button> <button class="btn red" onclick="removeFund('${f.ticker}')">Excluir</button></div></div>`).join('')}
function saveSettings(){db.settings.apiUrl=apiUrl.value.trim();db.settings.contribution=n(aporte.value);db.settings.universe=universe.value.toUpperCase();persist();alert('Salvo.')}async function updateAll(){let ok=0;for(let i=0;i<db.funds.length;i++){try{db.funds[i]={...db.funds[i],...await request(db.funds[i].ticker)};ok++}catch{}}persist();alert(ok+' atualizado(s).')}
async function discover(){let tickers=[...new Set(db.settings.universe.split(/[,;\s]+/))].filter(t=>t&&!db.funds.some(f=>f.ticker===t)),arr=[];discoverButton.disabled=true;for(let i=0;i<tickers.length;i++){discoverButton.textContent=`Consultando ${i+1}/${tickers.length}`;try{let f=await request(tickers[i]);f.score=score(f);if(f.price<=n(maxPrice.value)&&f.dy>=n(minDY.value)/100&&f.pvp<=n(maxPVP.value)&&f.score>=n(minScore.value))arr.push(f)}catch{}}arr.sort((a,b)=>b.score-a.score);discoverResults.innerHTML=arr.slice(0,5).map(f=>`<div class="card fund"><div><h3>${f.ticker}</h3><div>${money(f.price)} · DY ${pct(f.dy)} · P/VP ${f.pvp}x</div><div class="score">${f.score.toFixed(0)}/100</div></div><button class="btn" onclick='addFound(${JSON.stringify(f)})'>Adicionar</button></div>`).join('')||'<div class="card">Nenhum ativo passou pelos filtros.</div>';discoverButton.disabled=false;discoverButton.textContent='🔎 Buscar 5 melhores'}function addFound(f){db.funds.push({...f,target:0,group:'alt'});persist()}
function openFund(t=''){let f=db.funds.find(x=>x.ticker===t)||{ticker:'',price:0,dy:0,pvp:1,type:'FII'};fundForm.innerHTML=`<div class="field"><label>Ticker</label><input id="ft" value="${f.ticker}"></div><div class="field"><label>Tipo</label><input id="fty" value="${f.type}"></div><div class="full"><button class="btn alt" onclick="fillFund()">↻ Buscar dados</button></div><div class="field"><label>Preço</label><input id="fp" value="${f.price}"></div><div class="field"><label>DY decimal</label><input id="fdy" value="${f.dy}"></div><div class="field"><label>P/VP</label><input id="fv" value="${f.pvp}"></div>`;fundDialog.dataset.old=t;fundDialog.showModal()}async function fillFund(){try{let f=await request(ft.value.toUpperCase());fp.value=f.price;fdy.value=f.dy;fv.value=f.pvp;fty.value=f.type}catch(e){alert(e.message)}}function saveFund(){let old=fundDialog.dataset.old,o={ticker:ft.value.toUpperCase(),type:fty.value,price:n(fp.value),dy:n(fdy.value),pvp:n(fv.value),updated:new Date().toISOString().slice(0,10)};if(old)db.funds[db.funds.findIndex(f=>f.ticker===old)]=o;else db.funds.push(o);fundDialog.close();persist()}function removeFund(t){if(confirm('Excluir '+t+'?')){db.funds=db.funds.filter(f=>f.ticker!==t);persist()}}
function openMove(){moveForm.innerHTML=`<div class="field"><label>Ativo</label><select id="mt">${db.funds.map(f=>`<option>${f.ticker}</option>`)}</select></div><div class="field"><label>Quantidade</label><input id="mq" type="number"></div><div class="field"><label>Preço</label><input id="mp" type="number"></div>`;moveDialog.showModal()}function saveMove(){db.moves.push({ticker:mt.value,qty:n(mq.value),price:n(mp.value)});moveDialog.close();persist()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.page).classList.add('on')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
