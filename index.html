<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071713"><meta name="apple-mobile-web-app-capable" content="yes"><title>FII Smart</title><link rel="manifest" href="./manifest.json?v=13"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=13"><link rel="icon" href="./icon-192.png?v=13"><style>
:root{--bg:#061411;--p:#0d241e;--p2:#12372c;--line:#21473b;--txt:#eef8f4;--muted:#8ba99f;--g:#48dfa2;--red:#ff858d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#174a3a,transparent 35%),var(--bg);color:var(--txt);font:14px system-ui}.app{max-width:1100px;margin:auto;padding:18px 14px 90px}button,input,textarea,select{font:inherit}.top,.head,.actions,.fund{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;border-radius:13px}h1,h2,h3,p{margin:0}.muted{color:var(--muted)}.hero,.card{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:20px;padding:18px}.hero{margin-top:16px}.hero b{font-size:38px;display:block}.tag{display:inline-block;color:var(--g);background:#163b30;padding:6px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 22px}.kpi b{display:block;font-size:20px;margin-top:5px}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--g);color:#042018;font-weight:750}.btn.alt{background:#173b31;color:var(--txt);border:1px solid #2b5a4a}.btn.red{background:#3c2024;color:#ffc0c4}.section{margin-top:22px}.status{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.table{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;min-width:760px;border-collapse:collapse;background:#091d18}th,td{padding:12px;text-align:left;border-bottom:1px solid #193a31}.page{display:none}.page.on{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #2c5044;border-radius:11px;background:#071a15;color:var(--txt)}.full{grid-column:1/-1}.fund{margin-bottom:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#071813ee;border-top:1px solid var(--line)}nav button{border:0;background:none;color:var(--muted);padding:15px 14px}nav button.on{color:var(--g)}dialog{width:min(650px,94%);background:var(--p);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:20px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.head,.fund{align-items:flex-start;flex-direction:column}nav button{font-size:12px;padding:14px 8px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><img src="./icon-192.png?v=13"><div><h1>FII Smart</h1><span class="muted">Carteira e decisão de aportes</span></div></div><span id="date"></span></header>
<section id="home" class="page on"><div class="hero"><span class="muted">APORTE RECOMENDADO</span><b id="rec">--</b><span class="tag" id="why">Aguardando</span><div class="actions section" style="justify-content:flex-start"><strong id="aporteText"></strong><button class="btn" onclick="openRecord()">Registrar aporte</button></div></div><div id="status" class="status">Configure o Worker em Ajustes.</div><div id="kpis" class="grid"></div><div class="head"><h2>Ranking da carteira</h2><div><button class="btn alt" onclick="updateAll()">↻ Atualizar todos</button> <button class="btn" onclick="openFund()">+ FII</button></div></div><div class="table section"><table><thead><tr><th>#</th><th>FII</th><th>Preço</th><th>DY</th><th>P/VP</th><th>Peso</th><th>Score</th></tr></thead><tbody id="ranking"></tbody></table></div></section>
<section id="discover" class="page"><h2>Descobrir FIIs</h2><div class="card section"><div class="form"><div class="field"><label>Preço máximo</label><input id="maxPrice" type="number" value="20"></div><div class="field"><label>DY mínimo (%)</label><input id="minDy" type="number" value="7"></div><div class="field"><label>P/VP máximo</label><input id="maxPvp" type="number" value="1.10"></div><div class="field"><label>Score mínimo</label><input id="minScore" type="number" value="55"></div></div><button id="searchBtn" class="btn section" onclick="discover()">Buscar 5 melhores</button></div><div id="results" class="section"></div></section>
<section id="portfolio" class="page"><div class="head"><h2>Carteira</h2><button class="btn" onclick="openFund()">+ FII</button></div><div id="funds" class="section"></div></section>
<section id="records" class="page"><div class="head"><h2>Registros</h2><button class="btn" onclick="openRecord()">+ Registrar</button></div><div class="table section"><table><thead><tr><th>Data</th><th>Ativo</th><th>Tipo</th><th>Qtd.</th><th>Preço</th><th>Rendimento</th><th></th></tr></thead><tbody id="recordRows"></tbody></table></div></section>
<section id="settings" class="page"><h2>Ajustes</h2><div class="card section"><div class="form"><div class="field"><label>Cloudflare Worker</label><input id="worker"></div><div class="field"><label>Aporte mensal</label><input id="aporte" type="number"></div><div class="field full"><label>Universo da busca</label><textarea id="universe" rows="6"></textarea></div></div><div class="actions section"><button class="btn alt" onclick="testWorker()">Testar Worker</button><button class="btn" onclick="saveSettings()">Salvar</button><button class="btn alt" onclick="restoreSeed()">Restaurar FIIs originais</button></div></div></section></main>
<nav><button class="on" data-p="home">Início</button><button data-p="discover">Descobrir</button><button data-p="portfolio">Carteira</button><button data-p="records">Registros</button><button data-p="settings">Ajustes</button></nav>
<dialog id="fundDlg"><h2>Adicionar/editar FII</h2><div id="fundForm" class="form section"></div><div class="actions section"><button class="btn alt" onclick="fundDlg.close()">Cancelar</button><button class="btn" onclick="saveFund()">Salvar</button></div></dialog><dialog id="recordDlg"><h2>Novo registro</h2><div id="recordForm" class="form section"></div><div class="actions section"><button class="btn alt" onclick="recordDlg.close()">Cancelar</button><button class="btn" onclick="saveRecord()">Salvar</button></div></dialog>
<script>'use strict';const $=x=>document.getElementById(x),N=x=>Number(x||0),money=x=>N(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),pct=x=>(N(x)*100).toFixed(1)+'%';const SEED=[{"ticker": "CPTS11", "type": "Papel/Multiestratégia", "group": "core", "price": 7.51, "dy": 0.1433, "pvp": 0.87, "target": 0.3}, {"ticker": "VGIR11", "type": "Papel/CRI", "group": "core", "price": 9.69, "dy": 0.1558, "pvp": 0.99, "target": 0.25}, {"ticker": "KNSC11", "type": "Papel/CRI", "group": "core", "price": 9.01, "dy": 0.1276, "pvp": 1.03, "target": 0.2}, {"ticker": "MXRF11", "type": "Papel/Híbrido", "group": "core", "price": 9.19, "dy": 0.13, "pvp": 0.99, "target": 0.15}, {"ticker": "GARE11", "type": "Tijolo/Híbrido", "group": "core", "price": 8.34, "dy": 0.1194, "pvp": 0.92, "target": 0.1}, {"ticker": "BTCI11", "type": "Papel/CRI", "group": "alt", "price": 9.3, "dy": 0.1263, "pvp": 0.92, "target": 0}, {"ticker": "VCRI11", "type": "Papel/CRI", "group": "alt", "price": 7.56, "dy": 0.1462, "pvp": 0.8, "target": 0}];const U='ALZR11,BCRI11,BRCO11,BTLG11,CPTS11,GARE11,GGRC11,HGBS11,HGLG11,HSML11,IRDM11,JSRE11,KFOF11,KNCR11,KNIP11,KNRI11,KNSC11,LVBI11,MALL11,MXRF11,PMLL11,PVBI11,RBRF11,RBRR11,RECR11,RECT11,TRXF11,VISC11,XPLG11,XPML11';let raw;try{raw=JSON.parse(localStorage.getItem('fiiSmart')||'null')}catch{}let db=raw||{settings:{worker:'',contribution:250,universe:U},funds:SEED,records:[]};db.settings={worker:db.settings?.worker||db.settings?.workerUrl||db.settings?.apiUrl||'',contribution:db.settings?.contribution||250,universe:db.settings?.universe||U};db.records=Array.isArray(db.records)?db.records:(Array.isArray(db.moves)?db.moves:[]);if(!Array.isArray(db.funds)||!db.funds.length)db.funds=structuredClone(SEED);let edit='';function score(f){let dy=N(f.dy)*100,d=dy<5?20:dy<7?50:dy<9?75:dy<=13?100:dy<=16?85:dy<=20?60:30,p=N(f.pvp),v=p<.6?35:p<.75?65:p<=.95?100:p<=1.05?90:p<=1.15?70:40;return Math.max(0,Math.min(100,.55*d+.45*v-(dy>20?15:0)-(p<.6?10:0)))}function qty(t){return db.records.filter(r=>r.ticker===t&&r.kind!=='rendimento').reduce((s,r)=>s+N(r.qty),0)}function save(){localStorage.setItem('fiiSmart',JSON.stringify(db));render()}function render(){let total=db.funds.reduce((s,f)=>s+qty(f.ticker)*N(f.price),0);db.funds.forEach(f=>{f.score=score(f);f.qty=qty(f.ticker);f.market=f.qty*N(f.price);f.weight=total?f.market/total:0});let list=[...db.funds].sort((a,b)=>b.score-a.score),top=list[0];$('date').textContent=new Date().toLocaleDateString('pt-BR');$('rec').textContent=top?.ticker||'--';$('why').textContent=top?'Maior score atual':'Cadastre seus FIIs';$('aporteText').textContent=money(db.settings.contribution);$('kpis').innerHTML=[['Patrimônio',money(total)],['Renda estimada',money(db.funds.reduce((s,f)=>s+f.market*N(f.dy)/12,0))+'/mês'],['FIIs',db.funds.length],['Top score',top?top.score.toFixed(0)+'/100':'-']].map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('ranking').innerHTML=list.map((f,i)=>`<tr><td>${i+1}</td><td><b>${f.ticker}</b></td><td>${money(f.price)}</td><td>${pct(f.dy)}</td><td>${N(f.pvp).toFixed(2)}x</td><td>${pct(f.weight)}</td><td>${f.score.toFixed(0)}/100</td></tr>`).join('');$('funds').innerHTML=db.funds.map(f=>`<div class="card fund"><div><h3>${f.ticker}</h3><span class="muted">${f.type} · ${f.qty} cotas · ${money(f.market)} · alvo ${pct(f.target)}</span></div><div><button class="btn alt" onclick="openFund('${f.ticker}')">Editar</button> <button class="btn red" onclick="delFund('${f.ticker}')">Excluir</button></div></div>`).join('');$('recordRows').innerHTML=[...db.records].reverse().map(r=>`<tr><td>${r.date||'-'}</td><td>${r.ticker}</td><td>${r.kind==='rendimento'?'Rendimento':'Compra'}</td><td>${r.qty||'-'}</td><td>${r.kind==='rendimento'?'-':money(r.price)}</td><td>${money(r.income)}</td><td><button class="btn red" onclick="delRecord('${r.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="7">Nenhum registro.</td></tr>';$('worker').value=db.settings.worker;$('aporte').value=db.settings.contribution;$('universe').value=db.settings.universe}function api(){let u=db.settings.worker.replace(/\/+$/,'');if(!u)throw Error('Configure o Worker.');return u}async function req(t){let r=await fetch(`${api()}/fii?ticker=${t}`),d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Falha');return{ticker:d.ticker||t,type:d.segmentType||'FII',price:N(d.price),dy:N(d.dividendYield12m),pvp:N(d.priceToNav),updated:String(d.referenceDate||d.updatedAt).slice(0,10),source:d.source}}async function updateAll(){let ok=0;for(let i=0;i<db.funds.length;i++)try{db.funds[i]={...db.funds[i],...await req(db.funds[i].ticker)};ok++}catch{}save();$('status').textContent=ok+' ativo(s) atualizado(s).'}function openFund(t=''){edit=t;let f=db.funds.find(x=>x.ticker===t)||{ticker:'',type:'FII',price:0,dy:0,pvp:1,target:0,group:'alt'};$('fundForm').innerHTML=`<div class="field"><label>Ticker</label><input id="ft" value="${f.ticker}"></div><div class="field"><label>Tipo</label><input id="fty" value="${f.type}"></div><div class="full"><button class="btn alt" onclick="fillFund()">Buscar dados</button></div><div class="field"><label>Preço</label><input id="fp" value="${f.price}"></div><div class="field"><label>DY decimal</label><input id="fdy" value="${f.dy}"></div><div class="field"><label>P/VP</label><input id="fv" value="${f.pvp}"></div><div class="field"><label>Peso-alvo decimal</label><input id="falvo" value="${f.target||0}"></div>`;$('fundDlg').showModal()}async function fillFund(){try{let f=await req($('ft').value.toUpperCase());$('fty').value=f.type;$('fp').value=f.price;$('fdy').value=f.dy;$('fv').value=f.pvp}catch(e){alert(e.message)}}function saveFund(){let f={ticker:$('ft').value.toUpperCase(),type:$('fty').value,price:N($('fp').value),dy:N($('fdy').value),pvp:N($('fv').value),target:N($('falvo').value),group:'alt'};if(edit)db.funds[db.funds.findIndex(x=>x.ticker===edit)]={...db.funds.find(x=>x.ticker===edit),...f};else db.funds.push(f);$('fundDlg').close();save()}function delFund(t){if(confirm('Excluir '+t+'?')){db.funds=db.funds.filter(f=>f.ticker!==t);save()}}function openRecord(){let opts=db.funds.map(f=>`<option>${f.ticker}</option>`).join('');$('recordForm').innerHTML=`<div class="field"><label>Ativo</label><select id="rt">${opts}</select></div><div class="field"><label>Tipo</label><select id="rk"><option value="compra">Compra</option><option value="rendimento">Rendimento</option></select></div><div class="field"><label>Data</label><input id="rd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Quantidade</label><input id="rq" type="number"></div><div class="field"><label>Preço</label><input id="rp" type="number"></div><div class="field"><label>Rendimento</label><input id="ri" type="number" value="0"></div>`;$('recordDlg').showModal()}function saveRecord(){db.records.push({id:crypto.randomUUID(),ticker:$('rt').value,kind:$('rk').value,date:$('rd').value,qty:N($('rq').value),price:N($('rp').value),income:N($('ri').value)});$('recordDlg').close();save()}function delRecord(id){db.records=db.records.filter(r=>r.id!==id);save()}async function discover(){let ticks=[...new Set(db.settings.universe.split(/[,;\s]+/))].filter(t=>t&&!db.funds.some(f=>f.ticker===t)),a=[];$('searchBtn').disabled=true;for(let i=0;i<ticks.length;i++){try{let f=await req(ticks[i]);f.score=score(f);if(f.price<=N($('maxPrice').value)&&f.dy>=N($('minDy').value)/100&&f.pvp<=N($('maxPvp').value)&&f.score>=N($('minScore').value))a.push(f)}catch{}}a.sort((x,y)=>y.score-x.score);$('results').innerHTML=a.slice(0,5).map(f=>`<div class="card fund"><div><h3>${f.ticker}</h3><span>${money(f.price)} · DY ${pct(f.dy)} · P/VP ${f.pvp} · Score ${f.score.toFixed(0)}</span></div><button class="btn" onclick='addCandidate(${JSON.stringify(f)})'>Adicionar</button></div>`).join('')||'<div class="card">Nenhum ativo passou.</div>';$('searchBtn').disabled=false}function addCandidate(f){db.funds.push({...f,target:0,group:'alt'});save()}function saveSettings(){db.settings.worker=$('worker').value.trim();db.settings.contribution=N($('aporte').value);db.settings.universe=$('universe').value;save();alert('Salvo.')}async function testWorker(){try{let r=await fetch(api()+'/health'),d=await r.json();alert(d.message||'Conectado')}catch(e){alert(e.message)}}function restoreSeed(){if(confirm('Restaurar os 7 FIIs originais?')){db.funds=structuredClone(SEED);save()}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=13',{updateViaCache:'none'});render();</script></body></html>
